name: Privacy checks
'on':
  push: null
  pull_request: null
  workflow_dispatch: null
  schedule:
  - cron: 23 6 * * 1
  workflow_call: {}
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Install verified secret scanner
      run: 'curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
        -o /tmp/gitleaks.tar.gz

        echo ''551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz''
        | sha256sum -c -

        tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks

        echo /tmp >> "$GITHUB_PATH"

        '
    - name: Check tracked data and complete Git history
      run: python3 tools/privacy_check.py
